limit_req_zone $binary_remote_addr zone=api_requests:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=connections:10m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 9m;
    limit_conn connections 30;
    limit_req_status 429;
    limit_conn_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = / { return 302 /dashboard/login; }
    location = /admin { return 302 /admin/; }
    location /admin/ { try_files $uri $uri/ /admin/index.html; }
    location /pay/ {
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }
    location /v1/ {
        limit_req zone=api_requests burst=40 nodelay;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
    location = /healthz { proxy_pass http://api:3000; }
    location = /readyz { proxy_pass http://api:3000; }
    location / { try_files $uri $uri/ /index.html; }
}
